# CI: fast build/vet/test + lint on every PR, plus the race detector on every
# PR and on push (merges to main and release tags). gofer is a concurrency-heavy
# repo — its whole subject is many per-session OS processes — so a data race is
# a first-class defect that must block a PR, not merely a release. Running -race
# on the PR lane costs extra CI minutes but is the correct trade for this repo;
# do not gate it back to push-only without restoring PR-time race coverage some
# other way.
#
# The `lsp-live` job installs a real language server so the LSP tests actually
# run instead of skipping — see its own comment for why a skipping test is worse
# than a missing one here.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Type-check the build-tagged worker-fleet benchmark. Nothing else in CI
      # compiles it (that is the point of the tag), so without this it can rot
      # silently and stop being runnable at the commit its baseline names.
      - run: go vet -tags workerbench ./...

  # Allocation regression gate. Benchmarks are the only signal that catches the
  # failure mode this repo actually hits — work that scales with session count or
  # transcript length (gofer#298, gofer#308), which stays invisible to every
  # correctness test until a user reports the TUI feeling slow.
  #
  # It gates on allocs/op and B/op ONLY, never wall-clock: ns/op on a shared
  # runner is too noisy for a threshold that both catches regressions and does
  # not cry wolf, and a gate that cries wolf gets ignored. See scripts/bench.sh.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/bench.sh --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          # A restored analysis cache loses staticcheck's noreturn fact for
          # testing.T.Fatal, so SA5011 fires on every `if p == nil { t.Fatal(...) }`
          # in whichever packages that run happens to re-analyze — pre-existing
          # test files no commit touched. A fully warm cache hides it (results are
          # reused) and a genuinely cold run is clean; only the partial restore is
          # wrong, which is why it surfaces as a PR that "breaks" untouched files.
          # There are ~45 such sites across the repo, so annotating them is
          # unbounded whack-a-mole and excluding SA5011 in tests would give up a
          # real check. Analyzing from cold costs ~1-2min and is always correct.
          skip-cache: true

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The LSP live tests (internal/lspdiag, internal/supervisor) drive a REAL
  # language server and skip themselves when none is on PATH. Without gopls
  # installed here they skip in every other job — and a skipped test is
  # indistinguishable from a passing one in a CI summary, so the whole
  # "LSP verified working" guarantee would silently decay to nothing while the
  # checks stayed green. That is the failure this job exists to prevent: the
  # feature is exercised in reality but structurally invisible to the gate.
  #
  # gopls is pinned rather than @latest so a gopls release cannot change
  # diagnostic wording and break the assertions on an unrelated PR. Bump it
  # deliberately.
  lsp-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/tools/gopls@v0.21.1
      # Fail loudly if gopls did not land on PATH: without this the tests below
      # would skip and the job would pass green, recreating the exact blind spot.
      - run: gopls version
      # Drop setup-go's compiler problem matcher for THIS JOB ONLY.
      #
      # These tests deliberately write `fmt.Println(thisIdentifierDoesNotExist)`
      # into a scratch file so gopls emits a real diagnostic, then assert that
      # diagnostic reaches the tool result — the broken code IS the fixture. The
      # test logs gopls's output, which reads
      # `main.go:7:14: undefined: thisIdentifierDoesNotExist [compiler]`, and the
      # Go matcher parses that shape as a compile error and raises a CI
      # annotation. The result was a fully passing job reporting "3 errors" in
      # its summary.
      #
      # That is worse than cosmetic: annotations that are routinely wrong are
      # annotations people stop reading, so a real compile error would land in
      # the same ignored pile. Removing the matcher here loses nothing — this job
      # runs no build whose compiler output anyone needs annotated, and every
      # other job keeps its matcher. Job-scoped because the removal only affects
      # this runner.
      - run: echo "::remove-matcher owner=go::"
      - run: go test -count=1 -v -run 'TestLive_|LSP' ./internal/lspdiag/ ./internal/supervisor/ 2>&1 | tee lsp.log
      # Guard against the tests silently reverting to skipped: assert at least
      # one live test actually ran, and that none were skipped.
      #
      # The PASS pattern deliberately mirrors the -run filter above rather than
      # naming one test's prefix. Both live tests are real coverage
      # (TestLive_* at package level, *LSP* through the Supervisor wiring), so
      # requiring specifically a TestLive_ prefix would fail on a legitimate
      # rename while proving nothing extra — and the natural "fix" for that
      # false failure is to weaken the guard, which is the outcome to avoid.
      # Keep filter and assertion in sync if either changes.
      - name: Assert the live tests ran rather than skipped
        run: |
          if grep -q '^--- SKIP' lsp.log; then
            echo "::error::an LSP live test SKIPPED — gopls missing or guard regressed"; exit 1
          fi
          passed=$(grep -cE '^--- PASS: (TestLive_|.*LSP)' lsp.log || true)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::no live LSP test ran — coverage for a user-requested 'verified working' feature has gone missing"; exit 1
          fi
          echo "LSP live coverage confirmed running ($passed test(s)):"
          grep -E '^--- PASS: (TestLive_|.*LSP)' lsp.log
